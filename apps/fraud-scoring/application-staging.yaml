apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-scoring-staging
  namespace: platform
spec:
  project: cauri
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  source:
    repoURL: https://github.com/demo-org-np-migration/fraud-scoring.git
    targetRevision: main
    path: deploy/overlays/staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
