apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyc-service-prod
  namespace: platform
spec:
  project: cauri
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  source:
    repoURL: https://github.com/demo-org-np-migration/kyc-service.git
    targetRevision: main
    path: deploy/overlays/prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
