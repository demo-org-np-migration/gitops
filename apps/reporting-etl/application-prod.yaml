apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reporting-etl-prod
  namespace: platform
spec:
  project: cauri
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  sources:
  - repoURL: https://github.com/demo-org-np-migration/reporting-etl.git
    targetRevision: main
    path: chart
    helm:
      releaseName: reporting-etl
      valueFiles:
      - $values/apps/reporting-etl/values-prod.yaml
  - repoURL: https://github.com/demo-org-np-migration/gitops.git
    targetRevision: main
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false
