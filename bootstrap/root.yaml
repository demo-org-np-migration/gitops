# App-of-apps: esto es lo único que se aplica a mano (kubectl apply -f bootstrap/root.yaml).
# Argo lo sincroniza y a partir de ahí gestiona todo lo demás desde este mismo repo.
#
# path: apps con directory.recurse=true encuentra los application-*.yaml en cada apps/<app>/,
# pero también encontraría accidentalmente los values-*.yaml si no fueran *.yaml sin kind
# Application (Argo los ignora igual porque no tienen apiVersion/kind de Application: los
# values son planos, no manifests). Sumamos projects/ con un segundo recurse porque
# directory.include con múltiples globs no está soportado de forma confiable en Argo 2.x
# para un solo Application de tipo directory (ver docs/notas de Paula). Dos Applications
# "root" (uno por directorio) es más verboso pero renderiza con cualquier Argo 2.x sin
# depender de que el include-glob haga lo que uno espera.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: platform
spec:
  project: cauri
  source:
    repoURL: https://github.com/demo-org-np-migration/gitops.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-projects
  namespace: platform
spec:
  project: cauri
  source:
    repoURL: https://github.com/demo-org-np-migration/gitops.git
    targetRevision: main
    path: projects
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
